name: Build JOboost APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo \"\C:\JOboost_APK/gradle-8.0/bin\" >> \

    - name: Add Android platform
      run: cordova platform add android@12

    - name: Build APK (Debug)
      run: cordova build android --debug --verbose

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: JOboost-APK-debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
