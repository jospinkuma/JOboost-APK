name: Build JOboost APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova@latest

    - name: Add Android platform
      run: cordova platform add android@latest

    - name: Build APK (Debug)
      run: cordova build android --debug

    - name: Build APK (Release - unsigned)
      run: cordova build android --release
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: JOboost-APK-debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: JOboost-APK-release
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: warn
